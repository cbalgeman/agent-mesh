[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "my-agent-mesh"
version = "0.3.0"
description = "Local, auditable coordination and decision tracking for human and AI-agent teams"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "agent-mesh contributors" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    # Stdlib-only by design for core. Optional integrations can wrap the CLI.
]

[project.urls]
Homepage = "https://github.com/cbalgeman/agent-mesh"
Repository = "https://github.com/cbalgeman/agent-mesh"
Issues = "https://github.com/cbalgeman/agent-mesh/issues"
Changelog = "https://github.com/cbalgeman/agent-mesh/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = [
    "pytest>=7",
    "ruff>=0.4",
]

[project.scripts]
agent-mesh = "agent_mesh.cli.mail:main"
agent-q = "agent_mesh.cli.q:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests/public"]
addopts = "-ra"
pythonpath = ["src"]
